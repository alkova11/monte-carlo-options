[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mc-options-lab"
version = "0.2.0"
description = "Reproducible Monte Carlo option pricing and variance reduction lab"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "pandas>=2.2",
    "pyarrow>=19",
    "plotly>=6",
]

[project.scripts]
quant-options = "mc_options.cli:main"
quant-options-app = "mc_options.web:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "playwright>=1.50"]

[tool.hatch.build.targets.wheel]
packages = ["src/mc_options"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".bootstrap", ".python", ".uv-cache", ".browsers", "node_modules", ".npm-cache", "release"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
